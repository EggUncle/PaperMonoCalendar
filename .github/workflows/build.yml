name: Firmware checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: PaperMonoCalendar
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.4.1
      - name: Test actual firmware decoder with synthetic packets
        working-directory: PaperMonoCalendar
        run: python3 -m unittest discover -s tests -v
      - name: Install fixed dependencies
        working-directory: PaperMonoCalendar
        run: sh tools/setup.sh
      - name: Verify synthetic UI previews match current firmware
        working-directory: PaperMonoCalendar
        run: |
          ARDUINO_USER_DIR="$(arduino-cli config get directories.user)"
          python3 tools/render_previews.py --font-dir "$ARDUINO_USER_DIR/libraries/M5GFX/src/lgfx/Fonts" --check
      - name: Compile PaperMono (never flash)
        working-directory: PaperMonoCalendar
        run: sh tools/compile.sh
